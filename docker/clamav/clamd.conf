# Stock clamd defaults StreamMaxLength to 25M. The app advertises a 100 MiB
# upload cap, so files in the 25-100 MiB band abort the INSTREAM exchange and
# surface as a transient scan failure plus three wasted retries — a size limit
# enforced by timeout rather than by a 413. Keep these >= UPLOAD_MAX_BYTES.
LogTime yes
Foreground yes

# REQUIRED, and not merely a second way in. This file REPLACES the image's
# clamd.conf, and the image's /init waits on
#   while [ ! -S /run/clamav/clamd.sock ] && [ ! -S /tmp/clamd.sock ]
# before it will report ready. Declaring only TCPSocket means neither unix
# socket is ever created, so the container spins on
# "Socket for clamd not found yet, retrying (n/1800)" forever and every scan
# fails with a transient error. Do not remove this line.
LocalSocket /run/clamav/clamd.sock

# The worker scans over TCP from another container; the unix socket above is
# for the image's own readiness check and clamdscan.
TCPSocket 3310
TCPAddr 0.0.0.0

StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 100M
