# Secure Document Management System - compose stack.
# Bare `docker compose up -d` works without a .env file: every variable uses
# ${VAR:-default} interpolation. Copy .env.example to .env to override.
#
# api/worker/worker-ocr share one image and boot through
# backend/scripts/entrypoint-api.sh, which waits for Postgres and applies
# migrations before exec'ing the service command (pipeline invariant #4:
# job state must be answerable from SQL, so the schema must exist first).
# The read-only scripts mount bridges the gap until the Dockerfile COPYs
# scripts/ into the image.
#
# Model artifacts (self-hosting, hard requirement):
#   * The ENCODER (BAAI/bge-small-en-v1.5) is baked into the image at build
#     time and read offline at runtime - see backend/Dockerfile. Nothing calls
#     a hosted inference API.
#   * The TRAINED CLASSIFIER (model.joblib) is NOT in the image: it is
#     gitignored, not redistributable, and AGENTS.md forbids committing model
#     weights. api/worker/worker-ocr bind-mount ./backend/var/models READ-ONLY
#     and point MODEL_ARTIFACT_PATH at it. Drop a trained model.joblib there to
#     enable ML classification; with the directory empty the loader returns
#     None and every document routes to human review, which is a normal state.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docmgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmgmt}
      POSTGRES_DB: ${POSTGRES_DB:-docmgmt}
    ports:
      - "5433:5432"  # changed from 55432 to 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docmgmt} -d ${POSTGRES_DB:-docmgmt}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # `mc ready local` is MinIO's documented healthcheck (mc ships in-image).
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    volumes:
      # Persist signature DB so restarts skip the multi-minute freshclam download.
      - clamavdb:/var/lib/clamav
      # Stock StreamMaxLength (25M) sits below the app's 100 MiB upload cap;
      # this raises it to match (see backend/tests/test_scan_limits.py).
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      # clamdscan --ping=1 exits 0 once clamd accepts connections. First boot
      # downloads signatures for minutes; start_period tolerates that and api/
      # workers deliberately depend on service_started, NOT service_healthy.
      test: ["CMD-SHELL", "clamdscan --ping=1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  migrate:
    build: ./backend
    init: true
    entrypoint: ["./scripts/entrypoint-api.sh"]
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docmgmt}:${POSTGRES_PASSWORD:-docmgmt}@postgres:5432/${POSTGRES_DB:-docmgmt}
      # Must be set HERE, not left to .env: that file is written for host-side
      # tooling and points at 127.0.0.1:55432, which inside this container is
      # the container itself. `environment` overrides `env_file`, so pinning it
      # keeps the host's loopback URL from leaking into the compose network.
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docmgmt}:${POSTGRES_PASSWORD:-docmgmt}@postgres:5432/${POSTGRES_DB:-docmgmt}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    init: true
    ports:
      - "8000:8000"
    entrypoint: ["./scripts/entrypoint-api.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - storage-data:/srv/app/var/storage
      # Read-only: the artifact is operator-supplied input, never worker output.
      - ./backend/var/models:/srv/app/var/models:ro
    environment:
      DATABASE_URL: postgresql+psycopg://docmgmt_app:docmgmt@postgres:5432/${POSTGRES_DB:-docmgmt}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local # dev default; switch to minio with real buckets later
      # Pinned, not derived. resolve_storage_root() anchors on the package
      # location, which inside the image is /srv/app/app -> /srv/var/storage,
      # while the shared volume is mounted at /srv/app/var/storage. Deriving it
      # silently splits the API's and worker's view of storage.
      DOCMGMT_LOCAL_STORAGE_ROOT: /srv/app/var/storage
      SCAN_ENABLED: "true"
      # The API embeds the SEARCH QUERY (not documents) for the pgvector arm;
      # it reads the manifest so query and corpus vectors share one model.
      MODEL_ARTIFACT_PATH: /srv/app/var/models/model.joblib
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-change-me-to-something-random}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    init: true
    entrypoint: ["./scripts/entrypoint-api.sh"]
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "default", "-l", "info", "--pool=solo"] # pool=solo dev-only; prod uses prefork/gevent
    volumes:
      - storage-data:/srv/app/var/storage
      - ./backend/var/models:/srv/app/var/models:ro
    environment:
      # Workers run cross-tenant by nature: the pipeline is handed a
      # document id and must load it before it can know whose it is. They
      # bind no app.tenant_id GUC, so under docmgmt_app the FORCE ROW LEVEL
      # SECURITY policies (#26) hide every row and load_version_context
      # raises NoResultFound on the first stage. The API keeps the
      # restricted role because it binds a tenant per request.
      # FOLLOW-UP: thread tenant_id through the task payload and bind it in
      # the worker session so RLS covers this path too, instead of exempting it.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docmgmt}:${POSTGRES_PASSWORD:-docmgmt}@postgres:5432/${POSTGRES_DB:-docmgmt}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      # Pinned, not derived. resolve_storage_root() anchors on the package
      # location, which inside the image is /srv/app/app -> /srv/var/storage,
      # while the shared volume is mounted at /srv/app/var/storage. Deriving it
      # silently splits the API's and worker's view of storage.
      DOCMGMT_LOCAL_STORAGE_ROOT: /srv/app/var/storage
      SCAN_ENABLED: "true"
      CLAMAV_HOST: clamav
      MODEL_ARTIFACT_PATH: /srv/app/var/models/model.joblib
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-change-me-to-something-random}
      # Invariant #11's ML cascade gate. Overridable so it can be recalibrated
      # once a REAL labelled hold-out exists: today's metrics.json reports no
      # real slice (see ml/artifact_contract.md), so 0.85 is a default, not a
      # measured operating point.
      ML_CONFIDENCE_THRESHOLD: "${ML_CONFIDENCE_THRESHOLD:-0.85}"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker-ocr:
    build: ./backend
    init: true
    entrypoint: ["./scripts/entrypoint-api.sh"]
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-Q", "ocr", "-l", "info", "--pool=solo"] # dedicated OCR queue; never merge with default
    volumes:
      - storage-data:/srv/app/var/storage
      - ./backend/var/models:/srv/app/var/models:ro
    environment:
      # Workers run cross-tenant by nature: the pipeline is handed a
      # document id and must load it before it can know whose it is. They
      # bind no app.tenant_id GUC, so under docmgmt_app the FORCE ROW LEVEL
      # SECURITY policies (#26) hide every row and load_version_context
      # raises NoResultFound on the first stage. The API keeps the
      # restricted role because it binds a tenant per request.
      # FOLLOW-UP: thread tenant_id through the task payload and bind it in
      # the worker session so RLS covers this path too, instead of exempting it.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docmgmt}:${POSTGRES_PASSWORD:-docmgmt}@postgres:5432/${POSTGRES_DB:-docmgmt}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      # Pinned, not derived. resolve_storage_root() anchors on the package
      # location, which inside the image is /srv/app/app -> /srv/var/storage,
      # while the shared volume is mounted at /srv/app/var/storage. Deriving it
      # silently splits the API's and worker's view of storage.
      DOCMGMT_LOCAL_STORAGE_ROOT: /srv/app/var/storage
      SCAN_ENABLED: "true"
      CLAMAV_HOST: clamav
      MODEL_ARTIFACT_PATH: /srv/app/var/models/model.joblib
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-change-me-to-something-random}
      # Invariant #11's ML cascade gate. Overridable so it can be recalibrated
      # once a REAL labelled hold-out exists: today's metrics.json reports no
      # real slice (see ml/artifact_contract.md), so 0.85 is a default, not a
      # measured operating point.
      ML_CONFIDENCE_THRESHOLD: "${ML_CONFIDENCE_THRESHOLD:-0.85}"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
  clamavdb:
  storage-data:
